<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{doctor/layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1">Prescriptions</h1>
                <p class="text-muted mb-0">Issue and manage patient medical prescriptions.</p>
            </div>
            <a th:href="@{/doctor/prescriptions/add}" class="btn btn-primary px-4 py-2 d-flex align-items-center gap-2" style="border-radius: 12px;">
                <i data-lucide="plus-circle"></i> Add Prescription
            </a>
        </div>

        <!-- Prescriptions Table -->
        <div class="card p-4" style="border-radius: 20px; border: none; box-shadow: var(--shadow-md);">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead style="background-color: var(--primary-light); color: var(--primary);">
                        <tr>
                            <th class="py-3 px-4 rounded-start">Patient</th>
                            <th class="py-3 px-3">Doctor</th>
                            <th class="py-3 px-3">Medicine Name</th>
                            <th class="py-3 px-3">Dosage</th>
                            <th class="py-3 px-4 rounded-end text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="presc : ${prescriptions}">
                            <td class="px-4 fw-semibold" th:text="${presc.patient.getFirstName() + ' ' + presc.patient.getLastName()}">John Doe</td>
                            <td class="px-3" th:text="${presc.doctor.getFullName()}">Dr. Michael Brown</td>
                            <td class="px-3 fw-bold text-dark" th:text="${presc.medicineName}">Amoxicillin</td>
                            <td class="px-3">
                                <span class="badge bg-light text-dark border px-2 py-1" th:text="${presc.dosage}">500mg</span>
                            </td>
                            <td class="px-4 text-end">
                                <div class="btn-group gap-1">
                                    <a th:href="@{/doctor/prescriptions/view/{id}(id=${presc.id})}" class="btn btn-sm btn-outline-info" style="border-radius: 8px;">View</a>
                                    <a th:href="@{/doctor/prescriptions/edit/{id}(id=${presc.id})}" class="btn btn-sm btn-outline-primary" style="border-radius: 8px;">Edit</a>
                                    <a th:href="@{/doctor/prescriptions/delete/{id}(id=${presc.id})}" class="btn btn-sm btn-outline-danger" style="border-radius: 8px;" onclick="return confirm('Are you sure you want to delete this prescription?')">Delete</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(prescriptions)}">
                            <td colspan="5" class="text-center py-5 text-muted">No prescriptions found. Click 'Add Prescription' to create one.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
