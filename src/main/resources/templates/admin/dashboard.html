<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScheduler | Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar { width: 260px; height: 100vh; background: #1e293b; color: white; position: fixed; padding: 24px; }
        .main-content { margin-left: 260px; padding: 40px; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .stat-card h3 { font-size: 2rem; font-weight: 700; color: #3b82f6; }
        .stat-card p { color: #64748b; font-weight: 500; }
        .admin-action { background: white; padding: 32px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .btn { padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .nav-link { color: #cbd5e1; text-decoration: none; display: block; padding: 12px 0; font-weight: 500; }
        .nav-link:hover { color: white; }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="sidebar">
        <h2 style="margin-bottom: 40px;">MediAdmin</h2>
        <nav>
            <a href="/admin/dashboard" class="nav-link" style="color: white;">Dashboard</a>
            <a href="/doctor/list" class="nav-link">Manage Doctors</a>
            <a href="/patient/list" class="nav-link">Manage Patients</a>
            <a href="/appointment/list" class="nav-link">Manage Appointments</a>
            <a href="/logout" class="nav-link" style="margin-top: 40px; color: #ef4444;">Logout</a>
        </nav>
    </div>
    
    <div class="main-content">
        <header style="margin-bottom: 40px;">
            <h1 th:text="${title}">Admin Control Center</h1>
            <p style="color: #64748b;">System Overview & Management</p>
        </header>
        
        <div class="stat-grid">
            <div class="stat-card">
                <h3 th:text="${doctorCount}">0</h3>
                <p>Total Doctors</p>
            </div>
            <div class="stat-card">
                <h3 th:text="${patientCount}">0</h3>
                <p>Total Patients</p>
            </div>
            <div class="stat-card">
                <h3 th:text="${appointmentCount}">0</h3>
                <p>Total Appointments</p>
            </div>
        </div>
        
        <div class="admin-action">
            <h3>Quick Actions</h3>
            <div style="display: flex; gap: 16px; margin-top: 20px;">
                <a href="/doctor/create" class="btn btn-primary">Add New Doctor</a>
                <a href="/patient/create" class="btn btn-primary" style="background: #10b981;">Add New Patient</a>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
