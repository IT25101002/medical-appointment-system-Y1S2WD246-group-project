<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{doctor/layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <section class="welcome-section mb-4">
            <h1 class="h3 fw-bold" th:text="${title}">Patient List</h1>
            <p class="text-muted">View and manage your patient records.</p>
        </section>

        <div class="card p-0" style="border-radius: 24px; border: none; box-shadow: var(--shadow-lg); overflow: hidden;">
            <div class="table-responsive">
                <table class="table table-hover mb-0" style="vertical-align: middle;">
                    <thead class="bg-light">
                        <tr>
                            <th class="px-4 py-3 text-muted fw-semibold border-0">ID</th>
                            <th class="px-4 py-3 text-muted fw-semibold border-0">Patient Name</th>
                            <th class="px-4 py-3 text-muted fw-semibold border-0">Email</th>
                            <th class="px-4 py-3 text-muted fw-semibold border-0">Phone</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(patients)}">
                            <td colspan="4" class="text-center py-5 text-muted">
                                <i data-lucide="users" class="mb-2 opacity-50" style="width: 48px; height: 48px;"></i>
                                <p class="mb-0">No patients found.</p>
                            </td>
                        </tr>
                        <tr th:each="patient : ${patients}" th:if="${patient != null}">
                            <td class="px-4 py-3" th:text="${'#' + patient.id}"></td>
                            <td class="px-4 py-3">
                                <div class="fw-semibold text-dark" th:text="${patient.firstName + ' ' + patient.lastName}"></div>
                            </td>
                            <td class="px-4 py-3" th:text="${patient.email}"></td>
                            <td class="px-4 py-3" th:text="${patient.phone}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
