<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{doctor/layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <section class="welcome-section mb-4">
            <h1 class="h3 fw-bold" th:text="${title}">Appointments</h1>
            <p class="text-muted">Manage your patient appointments.</p>
        </section>

        <div class="card p-0" style="border-radius: 24px; border: none; box-shadow: var(--shadow-lg); overflow: hidden;">
            <div class="table-responsive">
                <table class="table table-hover mb-0" style="vertical-align: middle;">
                    <thead class="bg-light">
                        <tr>
                            <th class="px-4 py-3 text-muted fw-semibold border-0">ID</th>
                            <th class="px-4 py-3 text-muted fw-semibold border-0">Patient</th>
                            <th class="px-4 py-3 text-muted fw-semibold border-0">Date & Time</th>
                            <th class="px-4 py-3 text-muted fw-semibold border-0">Reason</th>
                            <th class="px-4 py-3 text-muted fw-semibold border-0">Status</th>
                            <th class="px-4 py-3 text-muted fw-semibold border-0 text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(appointments)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i data-lucide="calendar-x" class="mb-2 opacity-50" style="width: 48px; height: 48px;"></i>
                                <p class="mb-0">No appointments found.</p>
                            </td>
                        </tr>
                        <tr th:each="appointment : ${appointments}">
                            <td class="px-4 py-3" th:text="${'#' + appointment.id}"></td>
                            <td class="px-4 py-3">
                                <div class="d-flex align-items-center gap-3" th:if="${appointment.patient != null}">
                                    <div class="fw-semibold text-dark" th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName}"></div>
                                </div>
                            </td>
                            <td class="px-4 py-3">
                                <span class="fw-semibold" th:text="${appointment.date}"></span><br>
                                <span class="text-muted small" th:text="${appointment.time}"></span>
                            </td>
                            <td class="px-4 py-3" th:text="${appointment.reason}"></td>
                            <td class="px-4 py-3">
                                <span class="badge rounded-pill px-3 py-2" th:classappend="${appointment.status.name() == 'PENDING'} ? 'bg-warning-subtle text-warning' : (${appointment.status.name() == 'APPROVED'} ? 'bg-success-subtle text-success' : 'bg-primary-subtle text-primary')" th:text="${appointment.status}"></span>
                            </td>
                            <td class="px-4 py-3 text-end">
                                <div class="d-flex justify-content-end gap-2" th:if="${appointment.status.name() == 'PENDING'}">
                                    <a th:href="@{/doctor/appointments/approve/{id}(id=${appointment.id})}" class="btn btn-sm btn-success px-3" style="border-radius: 8px;">Approve</a>
                                    <a th:href="@{/doctor/appointments/reject/{id}(id=${appointment.id})}" class="btn btn-sm btn-danger px-3" style="border-radius: 8px;">Reject</a>
                                </div>
                                <span th:if="${appointment.status.name() != 'PENDING'}" class="text-muted small">No actions</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
