<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{doctor/layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <div class="card max-w-2xl mx-auto p-5" style="max-width: 650px; border-radius: 24px; border: none; box-shadow: var(--shadow-lg);">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="p-3 bg-primary-subtle text-primary rounded-circle">
                    <i data-lucide="edit-3"></i>
                </div>
                <div>
                    <h2 class="h4 fw-bold mb-1">Edit Confirmed Schedule Block</h2>
                    <p class="text-muted small mb-0">Modify the working date, time slot, or status.</p>
                </div>
            </div>

            <form th:action="@{/doctor/schedules/update/{id}(id=${scheduleObj.id})}" th:object="${scheduleObj}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Doctor</label>
                    <select th:field="*{doctor}" class="form-select p-3" style="border-radius: 12px;" required>
                        <option th:each="doc : ${doctors}" th:value="${doc.id}" th:text="${doc.getFullName()}" th:selected="${doc.id == scheduleObj.doctor.id}">Dr. Name</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Specific Date</label>
                    <input type="date" th:field="*{date}" class="form-control p-3" style="border-radius: 12px;" required>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-muted small">Start Time</label>
                        <input type="time" th:field="*{startTime}" class="form-control p-3" style="border-radius: 12px;" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold text-muted small">End Time</label>
                        <input type="time" th:field="*{endTime}" class="form-control p-3" style="border-radius: 12px;" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Status</label>
                    <select th:field="*{status}" class="form-select p-3" style="border-radius: 12px;" required>
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="CANCELLED">CANCELLED</option>
                    </select>
                </div>

                <div class="d-flex gap-3 pt-2">
                    <button type="submit" class="btn btn-primary p-3 flex-grow-1 fw-bold" style="border-radius: 12px;">Update Schedule Block</button>
                    <a th:href="@{/doctor/schedules}" class="btn btn-outline-secondary p-3 fw-bold px-4" style="border-radius: 12px;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
