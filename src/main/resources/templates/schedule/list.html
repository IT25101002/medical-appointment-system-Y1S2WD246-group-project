<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{doctor/layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1">Confirmed Schedules</h1>
                <p class="text-muted mb-0">Manage doctor specific working dates and time slots.</p>
            </div>
            <a th:href="@{/doctor/schedules/add}" class="btn btn-primary px-4 py-2 d-flex align-items-center gap-2" style="border-radius: 12px;">
                <i data-lucide="plus-circle"></i> Add Schedule Block
            </a>
        </div>

        <!-- Filter Bar -->
        <div class="card p-4 mb-4" style="border-radius: 20px; border: none; box-shadow: var(--shadow-sm);">
            <form th:action="@{/doctor/schedules}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-semibold">Filter by Doctor</label>
                    <select name="doctorId" class="form-select" style="border-radius: 10px;">
                        <option value="">All Doctors</option>
                        <option th:each="doc : ${doctors}" th:value="${doc.id}" th:text="${doc.getFullName()}" th:selected="${doc.id == selectedDoctorId}">Dr. Name</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-semibold">Filter by Date</label>
                    <input type="date" name="date" class="form-control" th:value="${selectedDate}" style="border-radius: 10px;">
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4" style="border-radius: 10px;">Filter</button>
                    <a th:href="@{/doctor/schedules}" class="btn btn-outline-secondary px-4" style="border-radius: 10px;">Reset</a>
                </div>
            </form>
        </div>

        <!-- Schedules Table -->
        <div class="card p-4" style="border-radius: 20px; border: none; box-shadow: var(--shadow-md);">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead style="background-color: var(--primary-light); color: var(--primary);">
                        <tr>
                            <th class="py-3 px-4 rounded-start">Doctor</th>
                            <th class="py-3 px-3">Date</th>
                            <th class="py-3 px-3">Time Slot</th>
                            <th class="py-3 px-3">Status</th>
                            <th class="py-3 px-4 rounded-end text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="sched : ${schedules}">
                            <td class="px-4 fw-semibold" th:text="${sched.doctor.getFullName()}">Dr. Michael Brown</td>
                            <td class="px-3" th:text="${#temporals.format(sched.date, 'MMM dd, yyyy')}">May 20, 2026</td>
                            <td class="px-3">
                                <span class="badge bg-light text-dark border px-2 py-1" th:text="${sched.startTime + ' - ' + sched.endTime}">09:00 - 13:00</span>
                            </td>
                            <td class="px-3">
                                <span class="badge px-3 py-1 rounded-pill" th:classappend="${sched.status.name() == 'ACTIVE'} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-danger-subtle text-danger border border-danger-subtle'" th:text="${sched.status}">ACTIVE</span>
                            </td>
                            <td class="px-4 text-end">
                                <div class="btn-group gap-1">
                                    <a th:href="@{/doctor/schedules/view/{id}(id=${sched.id})}" class="btn btn-sm btn-outline-info" style="border-radius: 8px;">View</a>
                                    <a th:href="@{/doctor/schedules/edit/{id}(id=${sched.id})}" class="btn btn-sm btn-outline-primary" style="border-radius: 8px;">Edit</a>
                                    <a th:href="@{/doctor/schedules/delete/{id}(id=${sched.id})}" class="btn btn-sm btn-outline-danger" style="border-radius: 8px;" onclick="return confirm('Are you sure you want to delete this schedule block?')">Delete</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(schedules)}">
                            <td colspan="5" class="text-center py-5 text-muted">No schedule blocks found matching the criteria.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
