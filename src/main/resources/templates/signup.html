<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScheduler | Sign Up</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
            min-height: 100vh;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .login-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .login-card p {
            color: var(--text-muted);
            margin-bottom: 32px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            text-align: left;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .full-width {
            grid-column: span 2;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-content);
            font-family: inherit;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 1.5rem;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            font-size: 0.875rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="login-card">
        <div class="logo-icon">
            <i data-lucide="user-plus"></i>
        </div>
        <h1>Patient Registration</h1>
        <p>Create your account to book appointments</p>
        
        <form th:action="@{/signup}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="firstName" placeholder="John" pattern="^[A-Za-z\s]+$" title="First name should only contain letters" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="lastName" placeholder="Doe" pattern="^[A-Za-z\s]+$" title="Last name should only contain letters" required>
                </div>
                <div class="form-group full-width">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="e.g. 1234567890" pattern="^\d{1,10}$" maxlength="10" title="Phone number cannot be more than 10 digits">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="form-group full-width">
                    <label>Address</label>
                    <input type="text" name="address" placeholder="123 Main St, City">
                </div>
            </div>
            
            <button type="submit" class="login-btn">Create Account</button>
            <a href="/login" class="back-link">Already have an account? Login here</a>
        </form>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
