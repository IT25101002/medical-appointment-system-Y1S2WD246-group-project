<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MediScheduler | Book Appointment</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: var(--bg-content); font-family: 'Inter', sans-serif; }
        .form-card { max-width: 600px; margin: 80px auto; background: white; padding: 40px; border-radius: 24px; box-shadow: var(--shadow-lg); }
        .form-control { border-radius: 12px; padding: 12px; }
        .btn-book { background: var(--primary); color: white; border-radius: 12px; padding: 14px; width: 100%; border: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2 class="mb-4 fw-bold">Schedule an Appointment</h2>
        
        <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}">Error</div>

        <form th:action="@{/appointment/create}" th:object="${appointment}" method="post">
            <div class="mb-3">
                <label class="form-label">Patient (Self)</label>
                <select th:field="*{patient}" class="form-control" required>
                    <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.firstName + ' ' + p.lastName}">Patient Name</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Select Doctor</label>
                <select th:field="*{doctor}" class="form-control" required>
                    <option value="">Choose a specialist...</option>
                    <option th:each="doc : ${doctors}" th:value="${doc.id}" th:text="${doc.getFullName() + ' (' + doc.specialty + ')'}">Dr. Name</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Preferred Date</label>
                    <input type="date" th:field="*{date}" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Preferred Time</label>
                    <input type="time" th:field="*{time}" class="form-control" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Reason for Visit</label>
                <textarea th:field="*{reason}" class="form-control" rows="3" placeholder="Briefly describe your symptoms..."></textarea>
            </div>

            <button type="submit" class="btn-book">Confirm Booking Request</button>
            <div class="text-center mt-3">
                <a href="/dashboard" class="text-decoration-none text-muted small">Cancel and go back</a>
            </div>
        </form>
    </div>
</body>
</html>
