<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MediScheduler | Availability List</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: var(--bg-content); font-family: 'Inter', sans-serif; }
        .container { margin-top: 50px; }
        .card { border-radius: 20px; border: none; box-shadow: var(--shadow-md); }
        .btn-primary { background-color: var(--primary); border: none; border-radius: 10px; }
        .table { background: white; border-radius: 15px; overflow: hidden; }
        thead { background-color: var(--primary-light); color: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold">Doctor Availability</h1>
            <a th:href="@{/availability/add}" class="btn btn-primary px-4 py-2">
                <i data-lucide="plus-circle" class="me-2"></i> Add Schedule
            </a>
        </div>

        <div class="card p-4">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Doctor</th>
                        <th>Day</th>
                        <th>Time Slot</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="avail : ${availabilities}">
                        <td class="fw-semibold" th:text="${avail.doctor.getFullName()}">Dr. Michael Brown</td>
                        <td th:text="${avail.workingDay}">Monday</td>
                        <td th:text="${avail.startTime + ' - ' + avail.endTime}">09:00 - 17:00</td>
                        <td>
                            <a th:href="@{/availability/edit/{id}(id=${avail.id})}" class="btn btn-sm btn-outline-primary me-2">Edit</a>
                            <a th:href="@{/availability/delete/{id}(id=${avail.id})}" class="btn btn-sm btn-outline-danger" 
                               onclick="return confirm('Are you sure you want to delete this schedule?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="mt-4">
            <a href="/doctor/dashboard" class="text-decoration-none text-muted">
                <i data-lucide="arrow-left" class="me-1"></i> Back to Dashboard
            </a>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
