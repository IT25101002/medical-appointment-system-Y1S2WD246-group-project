<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MediScheduler | Patient List</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: var(--bg-content); font-family: 'Inter', sans-serif; }
        .container { margin-top: 50px; }
        .card { border-radius: 20px; border: none; box-shadow: var(--shadow-md); }
        .btn-primary { background-color: var(--primary); border: none; border-radius: 10px; }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .table { background: white; border-radius: 15px; overflow: hidden; }
        thead { background-color: var(--primary-light); color: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold">Patient Directory</h1>
            <a th:href="@{/patient/create}" class="btn btn-primary px-4 py-2">
                <i data-lucide="plus-circle" class="me-2"></i> Add New Patient
            </a>
        </div>

        <div class="card p-4">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="patient : ${patients}">
                        <td th:text="${patient.id}">1</td>
                        <td class="fw-semibold" th:text="${patient.firstName + ' ' + patient.lastName}">John Doe</td>
                        <td th:text="${patient.email}">john@example.com</td>
                        <td th:text="${patient.phone}">+1234567890</td>
                        <td>
                            <a th:href="@{/patient/edit/{id}(id=${patient.id})}" class="btn btn-sm btn-outline-primary me-2">Edit</a>
                            <a th:href="@{/patient/delete/{id}(id=${patient.id})}" class="btn btn-sm btn-outline-danger" 
                               onclick="return confirm('Are you sure you want to delete this patient?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="mt-4">
            <a href="/admin/dashboard" class="text-decoration-none text-muted">
                <i data-lucide="arrow-left" class="me-1"></i> Back to Admin Dashboard
            </a>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
