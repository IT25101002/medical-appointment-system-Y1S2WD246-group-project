<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScheduler | Doctors</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <style>
        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }
        .doctor-card-large {
            background: var(--white);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            text-align: center;
        }
        .doctor-card-large:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        .doctor-img-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 4px solid var(--primary-light);
        }
        .doctor-specialty-badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 12px;
        }
        .doctor-card-large h3 {
            margin-bottom: 8px;
        }
        .doctor-card-large p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 20px;
        }
        .view-profile-btn {
            background: var(--bg-content);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: block;
            transition: all 0.2s;
        }
        .view-profile-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i data-lucide="shield-check"></i>
            <div>MediScheduler<br><small style="font-size: 0.65rem; font-weight: 500; color: var(--text-muted);">Patient Portal</small></div>
        </div>
        <nav class="nav-menu">
            <div class="nav-label">Main Menu</div>
            <ul style="list-style: none;">
                <li class="nav-item"><a href="/dashboard" class="nav-link"><i data-lucide="layout-dashboard"></i>Dashboard</a></li>
                <li class="nav-item"><a href="/patient/appointments" class="nav-link"><i data-lucide="calendar"></i>Appointments</a></li>
                <li class="nav-item"><a href="/patient/doctors" class="nav-link active"><i data-lucide="users"></i>Doctors</a></li>
                <li class="nav-item"><a href="/patient/prescriptions" class="nav-link"><i data-lucide="file-text"></i>Prescriptions</a></li>
                <li class="nav-item"><a href="/patient/records" class="nav-link"><i data-lucide="folder-heart"></i>Medical Records</a></li>
                <li class="nav-item"><a href="/patient/bills" class="nav-link"><i data-lucide="credit-card"></i>Bills & Payments</a></li>
                <li class="nav-item"><a href="/patient/messages" class="nav-link"><i data-lucide="mail"></i>Messages</a></li>
            </ul>
        </nav>
    </aside>

    <div class="main-container">
        <header class="topbar">
            <div class="search-container"><i data-lucide="search"></i><input type="text" placeholder="Search doctors..."></div>
            <div class="topbar-actions">
                <div class="user-profile">
                    <img th:src="@{/patient_avatar.png}" alt="User Avatar" class="user-avatar">
                    <div class="user-info"><div class="user-name">John Doe</div><div class="user-role">Patient</div></div>
                </div>
            </div>
        </header>

        <main class="dashboard-content" style="display: block;">
            <section class="welcome-section">
                <h1 th:text="${title}">Our Doctors</h1>
                <p>Consult with our world-class medical professionals.</p>
            </section>

            <div class="doctors-grid">
                <div th:each="doctor : ${doctors}" class="doctor-card-large">
                    <img th:src="@{${doctor.image != null && !doctor.image.isEmpty() ? '/' + doctor.image : '/doctor_avatar.png'}}" alt="Doctor" class="doctor-img-large">
                    <br>
                    <span class="doctor-specialty-badge" th:text="${doctor.specialty}">Specialty</span>
                    <h3 th:text="${doctor.getFullName()}">Doctor Name</h3>
                    <p th:text="${doctor.experience != null ? doctor.experience + ' Experience' : '10+ years Experience'}">Experience</p>
                    <a th:href="@{/patient/appointments(doctorId=${doctor.id}, email=${patientEmail})}" class="view-profile-btn">Book Appointment</a>
                </div>
            </div>
        </main>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
