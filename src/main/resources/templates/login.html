<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScheduler | Login</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .login-card p {
            color: var(--text-muted);
            margin-bottom: 32px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-content);
            font-family: inherit;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 1.5rem;
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="login-card">
        <div class="logo-icon">
            <i data-lucide="shield-check"></i>
        </div>

        <div th:if="${param.logout}" style="color: #1e3a8a; background: #eff6ff; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 0.875rem; border: 1px solid #bfdbfe; font-weight: 600;">
            👋 You have been successfully logged out.
        </div>

        <div th:if="${param.registered}" style="color: #166534; background: #f0fdf4; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 0.875rem; border: 1px solid #bbf7d0;">
            Account created successfully! Please login with your credentials.
        </div>

        <div th:if="${param.doctorError}" style="color: #ef4444; background: #fee2e2; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 0.875rem; border: 1px solid #fecaca;">
            Invalid doctor credentials. Please try again.
        </div>

        <div th:if="${param.error}" style="color: #ef4444; background: #fee2e2; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 0.875rem; border: 1px solid #fecaca;">
            Invalid email or password. Please try again.
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            
            
            <button type="submit" class="login-btn">Login</button>
            <p style="margin-top: 20px; font-size: 0.875rem;">New Patient? <a href="/signup" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign Up Here</a></p>
        </form>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
