<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScheduler | Manage Appointments</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <style>
        .container { padding: 40px; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .table th, .table td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .btn-danger { color: #ef4444; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>All Appointments</h1>
        <div class="card">
            <table class="table">
                <thead>
                    <tr>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="appt : ${appointments}">
                        <td th:text="${appt.patient.firstName + ' ' + appt.patient.lastName}">Patient</td>
                        <td th:text="${appt.doctor.firstName + ' ' + appt.doctor.lastName}">Doctor</td>
                        <td th:text="${appt.date}">Date</td>
                        <td>
                            <span th:class="'status-badge ' + ${#strings.toLowerCase(appt.status)}" th:text="${appt.status}">Status</span>
                        </td>
                        <td>
                            <a th:href="@{/appointment/delete/{id}(id=${appt.id})}" class="btn-danger" onclick="return confirm('Are you sure?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a href="/admin/dashboard" style="display: block; margin-top: 20px;">Back to Admin Dashboard</a>
    </div>
</body>
</html>
