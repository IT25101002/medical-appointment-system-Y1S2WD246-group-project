<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MediScheduler | Doctor Appointments</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: var(--bg-content); font-family: 'Inter', sans-serif; }
        .container { margin-top: 50px; }
        .card { border-radius: 20px; border: none; box-shadow: var(--shadow-md); }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status-pending { background: #fff7ed; color: #ea580c; }
        .status-approved { background: #f0fdf4; color: #16a34a; }
        .status-rejected { background: #fef2f2; color: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="h2 fw-bold mb-4">Patient Appointments</h1>

        <div class="card p-4">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Patient</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Reason</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="appt : ${appointments}">
                        <td class="fw-semibold" th:text="${appt.patient.firstName + ' ' + appt.patient.lastName}">John Doe</td>
                        <td th:text="${appt.date}">May 25, 2025</td>
                        <td th:text="${appt.time}">10:30 AM</td>
                        <td>
                            <span th:class="'status-badge status-' + ${appt.status.toString().toLowerCase()}" th:text="${appt.status}">PENDING</span>
                        </td>
                        <td th:text="${appt.reason}">General Checkup</td>
                        <td>
                            <div th:if="${appt.status.toString() == 'PENDING'}">
                                <a th:href="@{/appointment/approve/{id}(id=${appt.id})}" class="btn btn-sm btn-success me-2">Approve</a>
                                <a th:href="@{/appointment/reject/{id}(id=${appt.id})}" class="btn btn-sm btn-danger">Reject</a>
                            </div>
                            <span th:unless="${appt.status.toString() == 'PENDING'}" class="text-muted small">No actions</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="mt-4">
            <a href="/doctor/dashboard" class="text-decoration-none text-muted">
                <i data-lucide="arrow-left" class="me-1"></i> Back to Dashboard
            </a>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
