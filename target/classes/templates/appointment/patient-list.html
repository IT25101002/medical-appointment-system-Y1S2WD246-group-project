<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MediScheduler | My Appointments</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: var(--bg-content); font-family: 'Inter', sans-serif; }
        .container { margin-top: 50px; }
        .card { border-radius: 20px; border: none; box-shadow: var(--shadow-md); }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status-pending { background: #fff7ed; color: #ea580c; }
        .status-approved { background: #f0fdf4; color: #16a34a; }
        .status-rejected { background: #fef2f2; color: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold">My Appointments</h1>
            <a th:href="@{/appointment/book}" class="btn btn-primary px-4 py-2">Book New</a>
        </div>

        <div class="card p-4">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Doctor</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Reason</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="appt : ${appointments}">
                        <td class="fw-semibold" th:text="${appt.doctor.getFullName()}">Dr. Michael Brown</td>
                        <td th:text="${appt.date}">May 25, 2025</td>
                        <td th:text="${appt.time}">10:30 AM</td>
                        <td>
                            <span th:class="'status-badge status-' + ${appt.status.toString().toLowerCase()}" th:text="${appt.status}">PENDING</span>
                        </td>
                        <td th:text="${appt.reason}">General Checkup</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="mt-4">
            <a href="/dashboard" class="text-decoration-none text-muted">
                <i data-lucide="arrow-left" class="me-1"></i> Back to Dashboard
            </a>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
