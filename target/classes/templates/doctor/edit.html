<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MediScheduler | Edit Doctor</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: var(--bg-content); font-family: 'Inter', sans-serif; }
        .form-card { max-width: 600px; margin: 80px auto; background: white; padding: 40px; border-radius: 24px; box-shadow: var(--shadow-lg); }
        .form-control { border-radius: 12px; padding: 12px; }
        .btn-update { background: var(--primary); color: white; border-radius: 12px; padding: 14px; width: 100%; border: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2 class="mb-4 fw-bold">Update Doctor Details</h2>
        <form th:action="@{/doctor/update/{id}(id=${doctor.id})}" th:object="${doctor}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" th:field="*{firstName}" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" th:field="*{lastName}" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Specialty</label>
                <input type="text" th:field="*{specialty}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" th:field="*{phone}" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Professional Experience</label>
                <input type="text" th:field="*{experience}" class="form-control">
            </div>
            <div class="mb-4">
                <label class="form-label">Change Password</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="Leave blank to keep current">
            </div>
            <button type="submit" class="btn-update">Update Doctor Record</button>
            <div class="text-center mt-3">
                <a th:href="@{/doctor/list}" class="text-decoration-none text-muted small">Cancel and go back</a>
            </div>
        </form>
    </div>
</body>
</html>
