<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{doctor/layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <section class="welcome-section mb-4">
            <h1 class="h3 fw-bold" th:text="${title}">My Profile</h1>
            <p class="text-muted">View and update your professional profile and account settings.</p>
        </section>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 text-center h-100" style="background: white;">
                    <div class="mb-4">
                        <img th:src="@{/dr_michael_brown.png}" alt="Doctor Avatar" class="rounded-circle img-thumbnail mb-3" style="width: 150px; height: 150px; object-fit: cover;">
                        <h3 class="fw-bold mb-1" th:text="${doctorName}">Dr. Michael Brown</h3>
                        <p class="text-primary fw-medium mb-2" th:text="${doctor.specialty ?: 'Cardiologist'}">Cardiologist</p>
                        <span class="badge bg-light text-dark border px-3 py-2 rounded-pill">Active Staff</span>
                    </div>
                    <hr class="text-muted my-3">
                    <div class="text-start">
                        <div class="mb-3">
                            <small class="text-muted d-block">Email</small>
                            <span class="fw-medium" th:text="${doctor.email ?: 'dr.brown@example.com'}">dr.brown@example.com</span>
                        </div>
                        <div class="mb-3">
                            <small class="text-muted d-block">Phone</small>
                            <span class="fw-medium" th:text="${doctor.phone ?: '+1 (555) 234-5678'}">+1 (555) 234-5678</span>
                        </div>
                        <div class="mb-3">
                            <small class="text-muted d-block">Experience</small>
                            <span class="fw-medium" th:text="${doctor.experience ?: '15 years'}">15 years</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-4 p-4" style="background: white;">
                    <h4 class="fw-bold mb-4">Edit Profile Details</h4>
                    <div th:if="${param.success}" class="alert alert-success py-2 rounded-3 mb-4">
                        Profile updated successfully!
                    </div>
                    <form th:action="@{/doctor/profile/update}" th:object="${doctor}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-medium">First Name</label>
                                <input type="text" th:field="*{firstName}" class="form-control rounded-3" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Last Name</label>
                                <input type="text" th:field="*{lastName}" class="form-control rounded-3" required>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Specialty</label>
                                <input type="text" th:field="*{specialty}" class="form-control rounded-3" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Experience</label>
                                <input type="text" th:field="*{experience}" class="form-control rounded-3" required>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Email Address</label>
                                <input type="email" th:field="*{email}" class="form-control rounded-3" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Phone Number</label>
                                <input type="tel" th:field="*{phone}" class="form-control rounded-3" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium">New Password</label>
                            <input type="password" name="newPassword" class="form-control rounded-3" placeholder="Leave blank to keep current password">
                        </div>
                        <button type="submit" class="btn btn-primary px-4 py-2 rounded-3 fw-medium">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
