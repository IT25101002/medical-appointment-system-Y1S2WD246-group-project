<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScheduler | Medical Records</title>
    <link rel="stylesheet" th:href="@{/dashboard.css}">
    <style>
        .records-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 24px;
        }
        .record-item {
            background: var(--white);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s;
        }
        .record-item:hover {
            transform: scale(1.01);
            box-shadow: var(--shadow-md);
        }
        .record-main {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .record-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #fef2f2;
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .record-details h4 {
            font-size: 1rem;
            margin-bottom: 4px;
        }
        .record-details p {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }
        .record-actions {
            display: flex;
            gap: 12px;
        }
        .btn-download {
            padding: 8px 16px;
            border-radius: 8px;
            background: var(--primary-light);
            color: var(--primary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i data-lucide="shield-check"></i>
            <div>MediScheduler<br><small style="font-size: 0.65rem; font-weight: 500; color: var(--text-muted);">Patient Portal</small></div>
        </div>
        <nav class="nav-menu">
            <div class="nav-label">Main Menu</div>
            <ul style="list-style: none;">
                <li class="nav-item"><a href="/dashboard" class="nav-link"><i data-lucide="layout-dashboard"></i>Dashboard</a></li>
                <li class="nav-item"><a href="/patient/appointments" class="nav-link"><i data-lucide="calendar"></i>Appointments</a></li>
                <li class="nav-item"><a href="/patient/doctors" class="nav-link"><i data-lucide="users"></i>Doctors</a></li>
                <li class="nav-item"><a href="/patient/prescriptions" class="nav-link"><i data-lucide="file-text"></i>Prescriptions</a></li>
                <li class="nav-item"><a href="/patient/records" class="nav-link active"><i data-lucide="folder-heart"></i>Medical Records</a></li>
                <li class="nav-item"><a href="/patient/bills" class="nav-link"><i data-lucide="credit-card"></i>Bills & Payments</a></li>
                <li class="nav-item"><a href="/patient/messages" class="nav-link"><i data-lucide="mail"></i>Messages</a></li>
            </ul>
        </nav>
    </aside>

    <div class="main-container">
        <header class="topbar">
            <div class="search-container"><i data-lucide="search"></i><input type="text" placeholder="Search records..."></div>
            <div class="topbar-actions">
                <div class="user-profile">
                    <img th:src="@{/patient_avatar.png}" alt="User Avatar" class="user-avatar">
                    <div class="user-info"><div class="user-name">John Doe</div><div class="user-role">Patient</div></div>
                </div>
            </div>
        </header>

        <main class="dashboard-content" style="display: block;">
            <section class="welcome-section">
                <h1 th:text="${title}">Medical Records</h1>
                <p>Access your health history and test results.</p>
            </section>

            <div class="records-list">
                <div th:each="record : ${records}" class="record-item">
                    <div class="record-main">
                        <div class="record-icon"><i data-lucide="file-text"></i></div>
                        <div class="record-details">
                            <h4 th:text="${record.type}">Record Type</h4>
                            <p th:text="'Prescribed by ' + ${record.doctor} + ' • ' + ${record.date}">Details</p>
                        </div>
                    </div>
                    <div class="record-actions">
                        <a href="#" class="btn-download"><i data-lucide="download" style="width: 14px;"></i> Download</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
