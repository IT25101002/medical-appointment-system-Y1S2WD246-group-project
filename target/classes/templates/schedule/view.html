<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{doctor/layout :: layout(~{::content})}">
<body>
    <div th:fragment="content">
        <div class="card max-w-2xl mx-auto p-5" style="max-width: 650px; border-radius: 24px; border: none; box-shadow: var(--shadow-lg);">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <div class="p-3 bg-info-subtle text-info rounded-circle">
                        <i data-lucide="calendar"></i>
                    </div>
                    <div>
                        <h2 class="h4 fw-bold mb-1">Schedule Block Details</h2>
                        <p class="text-muted small mb-0">ID: #<span th:text="${scheduleObj.id}">1</span></p>
                    </div>
                </div>
                <span class="badge px-4 py-2 rounded-pill" th:classappend="${scheduleObj.status.name() == 'ACTIVE'} ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-danger-subtle text-danger border border-danger-subtle'" th:text="${scheduleObj.status}">ACTIVE</span>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-md-6">
                    <div class="p-3 bg-light rounded-4">
                        <div class="text-muted small fw-semibold mb-1">Doctor</div>
                        <div class="fw-bold" th:text="${scheduleObj.doctor.getFullName()}">Dr. Michael Brown</div>
                        <div class="text-muted small" th:text="${scheduleObj.doctor.getSpecialty()}">Specialist</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-3 bg-light rounded-4">
                        <div class="text-muted small fw-semibold mb-1">Specific Date</div>
                        <div class="fw-bold" th:text="${#temporals.format(scheduleObj.date, 'EEEE, MMMM dd, yyyy')}">Monday, May 20, 2026</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-3 bg-light rounded-4">
                        <div class="text-muted small fw-semibold mb-1">Start Time</div>
                        <div class="fw-bold" th:text="${scheduleObj.startTime}">09:00</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="p-3 bg-light rounded-4">
                        <div class="text-muted small fw-semibold mb-1">End Time</div>
                        <div class="fw-bold" th:text="${scheduleObj.endTime}">13:00</div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-3">
                <a th:href="@{/doctor/schedules/edit/{id}(id=${scheduleObj.id})}" class="btn btn-primary p-3 flex-grow-1 fw-bold" style="border-radius: 12px;">
                    <i data-lucide="edit-3" class="me-2"></i> Edit Schedule Block
                </a>
                <a th:href="@{/doctor/schedules}" class="btn btn-outline-secondary p-3 fw-bold px-4" style="border-radius: 12px;">Back to List</a>
            </div>
        </div>
    </div>
</body>
</html>
